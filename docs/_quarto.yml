project:
  type: website
  output-dir: _site
  resources:
    - CNAME
  render:
    - "*.qmd"
    - "*.ipynb"
    - "*.md"
    - "!quarto_example/"
    # Contributor policy, not user documentation: kept out of the site and
    # llms.txt. contributing.qmd links to it on GitHub.
    - "!developer/"
    # Draft outlines: excluded from the site and llms.txt until finished.
    # (Both open with an explicit "outline" callout.) Delete the matching line
    # to publish one. Complete-but-unlinked pages are left to render normally.
    - "!tutorials/standard-errors.qmd"
    - "!how-to/surrogate-indices-experimental-selection.qmd"
    # Held back for now; delete this line to publish it again.
    - "!tutorials/poisson-glm.qmd"

execute:
  freeze: auto
  python: "../.pixi/envs/docs/bin/python3"
  warning: false
  message: false

format:
  html:
    theme: [cosmo, theme.scss]
    toc: true
    toc-title: "On this page"
    toc-location: right
    code-copy: true
    code-overflow: scroll
    grid:
      sidebar-width: 250px
      body-width: 820px
      margin-width: 220px
    include-in-header:
      - analytics.html

metadata-files:
  - _sidebar.yml
  - _navigation.yml

website:
  title: "PyFixest"
  description: "Fast high-dimensional fixed effects regression in Python, closely mirroring the syntax of the R package fixest."
  llms-txt: true
  favicon: "figures/pyfixest-logo.png"
  page-navigation: true
  bread-crumbs: true
  navbar:
    background: light
    collapse-below: lg
    search: true
    left:
      - text: "Getting Started"
        file: getting-started.qmd
      - text: "Tutorials"
        file: tutorials/index.qmd
      - text: "Guides"
        file: how-to/index.qmd
      - text: "Function Reference"
        file: reference/index.qmd
      - text: "More"
        menu:
          - text: "Explanation"
          - text: "When Are Fixed Effects Problems Difficult?"
            file: explanation/difficult-fixed-effects.md
          - text: "On Small Sample Corrections"
            file: explanation/ssc.qmd
          - text: "Does PyFixest Match fixest?"
            file: explanation/compare-fixest-pyfixest.qmd
          - text: "Case Studies & Blog Posts"
            file: explanation/blog-posts.md
          - text: "---"
          - text: "Textbook Replications"
            file: textbook-replications/index.qmd
          - text: "Changelog"
            file: changelog.qmd
          - text: "Contributing"
            file: contributing.qmd
          - text: "Acknowledgements"
            file: acknowledgements.md
          - text: "---"
          - text: "Skills.md"
            file: skills.md
          - text: "llms.txt"
            href: llms.txt
    right:
      - icon: github
        href: https://github.com/py-econometrics/pyfixest/
        aria-label: "PyFixest on GitHub"
  page-footer:
    left: "PyFixest"
    right:
      - text: "Changelog"
        href: changelog.qmd
      - text: "Contributing"
        href: contributing.qmd
      - text: "GitHub"
        href: https://github.com/py-econometrics/pyfixest/

quartodoc:
  package: pyfixest
  title: "PyFixest Function Reference"
  parser: numpy
  rewrite_all_pages: True
  sidebar:
    file: _sidebar.yml
    collapse-level: 1
    contents:
      - "{{ contents }}"
      - section: Reference guides
        contents:
          - reference-guide/fitted-results.qmd
          - reference-guide/model-support.qmd
          - reference-guide/model-storage.qmd
          - reference-guide/example-data.qmd
          - reference-guide/errors.qmd
  renderer:
    style: _renderer.py
  options:
    signature_name: short

  sections:
  - title: Estimate models
    desc: Estimation functions in the `pf.` namespace. For IV or 2SLS, use `pf.feols()` with an
      instrument block. See the [estimator chooser](/reference-guide/fitted-results.qmd#choose-an-estimator).
    contents:
    - estimation.api.feols.feols
    - estimation.api.fepois.fepois
    - estimation.api.feglm.feglm
    - estimation.api.quantreg.quantreg
  - title: Inspect fitted results
    desc: Methods called on a fitted result as `fit.method()`. Start with the [result overview](/reference-guide/fitted-results.qmd).
    contents:
    - estimation.models.feols_.Feols.tidy
    - estimation.models.feols_.Feols.coef
    - estimation.models.feols_.Feols.se
    - estimation.models.feols_.Feols.tstat
    - estimation.models.feols_.Feols.pvalue
    - estimation.models.feols_.Feols.resid
  - title: Predict and recover fixed effects
    desc: Prediction and absorbed-effect recovery; check [model support](/reference-guide/model-support.qmd)
      and [storage requirements](/reference-guide/model-storage.qmd).
    contents:
    - estimation.models.feols_.Feols.predict
    - estimation.models.feols_.Feols.fixef
  - title: Inference and hypothesis tests
    desc: Configure covariance and small-sample adjustments, obtain intervals, and test hypotheses.
      Package functions use `pf.`; methods use `fit.`.
    contents:
    - estimation.models.feols_.Feols.confint
    - estimation.models.feols_.Feols.vcov
    - estimation.models.feols_.Feols.wald_test
    - estimation.models.feols_.Feols.wildboottest
    - estimation.models.feols_.Feols.ritest
    - estimation.models.feols_.Feols.plot_ritest
    - estimation.models.feols_.Feols.ccv
    - kind: page
      path: utils.utils.ssc
      summary:
        name: pf.ssc()
        desc: Configure small-sample corrections; includes the Ssc options class.
      contents:
      - utils.utils.ssc
      - utils.utils.Ssc
    - utils.utils.get_ssc
    - estimation.models.feiv_.Feiv.IV_Diag
    - estimation.post_estimation.multcomp.bonferroni
    - estimation.post_estimation.multcomp.rwolf
    - estimation.post_estimation.multcomp.wyoung
  - title: Tables and plots
    desc: Choose `coefplot()` for ordinary coefficients, `iplot()` for `i()` terms, and `qplot()`
      for quantile paths. See [outputs and customization](/reference-guide/fitted-results.qmd#tables-and-plots).
    contents:
    - report.summary
    - report.etable
    - report.coefplot
    - report.iplot
    - report.qplot
    - estimation.models.feols_.Feols.summary
    - estimation.models.feols_.Feols.etable
    - estimation.models.feols_.Feols.coefplot
    - estimation.models.feols_.Feols.iplot
  - title: Difference in differences
    desc: Difference-in-differences estimation and panel visualization in the `pf.` namespace,
      with result methods for local projections and saturated event studies.
    contents:
    - did.estimation.event_study
    - did.estimation.did2s
    - did.estimation.lpdid
    - did.visualize.panelview
    - name: did.saturated_twfe.SaturatedEventStudy
      members:
      - iplot
      - tidy
      - summary
      - aggregate
      - iplot_aggregate
      - test_treatment_heterogeneity
    - name: did.lpdid.LPDID
      members:
      - iplot
      - tidy
      - summary
  - title: Decomposition
    desc: Decompose coefficient differences and inspect, tabulate, or plot the returned decomposition.
    contents:
    - estimation.models.feols_.Feols.decompose
    - name: estimation.post_estimation.decomposition.GelbachDecomposition
      members:
      - tidy
      - etable
      - coefplot
    - estimation.post_estimation.decomposition.GelbachResults
  - title: Sequential inference
    desc: Safe anytime-valid inference for supported unweighted OLS fits. Read the [inference
      guide](/how-to/anytime-valid-inference.qmd) before tuning or monitoring.
    contents:
    - estimation.models.feols_.Feols.evalue
    - estimation.models.feols_.Feols.pvalue_savi
    - estimation.post_estimation.savi.optimal_mixture_precision
  - title: Computation and storage
    desc: Pass these configurations as `demeaner=pf.MapDemeaner(...)` or `demeaner=pf.LsmrDemeaner(...)`.
      See the [backend guide](/how-to/demeaner-backends.qmd) and [storage overview](/reference-guide/model-storage.qmd).
    contents:
    - name: demeaners.MapDemeaner
      members: []
    - name: demeaners.LsmrDemeaner
      members: []
    - estimation.models.feols_.Feols.update
  - title: Example data
    desc: Synthetic data generators in the `pf.` namespace. The [dataset chooser](/reference-guide/example-data.qmd)
      explains applications and key variables.
    contents:
    - utils.utils.get_data
    - utils.dgps.get_ivf_data
    - utils.dgps.get_bartik_data
    - utils.dgps.get_encouragement_data
    - utils.dgps.get_twin_data
    - utils.dgps.get_worker_panel
    - utils.dgps.get_motherhood_event_study_data
  - title: Fitted result objects
    desc: Returned by estimation functions; use their public methods rather than constructing
      them directly. Shared methods link to one canonical page.
    contents:
    - name: estimation.models.feols_.Feols
      include_inherited: true
      members:
      - tidy
      - coef
      - se
      - tstat
      - pvalue
      - confint
      - resid
      - vcov
      - wald_test
      - summary
      - etable
      - coefplot
      - iplot
      - predict
      - fixef
      - wildboottest
      - ritest
      - plot_ritest
      - ccv
      - decompose
      - update
      - evalue
      - pvalue_savi
      - preconditioner
    - name: estimation.models.feiv_.Feiv
      include_inherited: true
      members:
      - tidy
      - coef
      - se
      - tstat
      - pvalue
      - confint
      - resid
      - vcov
      - wald_test
      - summary
      - etable
      - coefplot
      - iplot
      - IV_Diag
    - name: estimation.models.fepois_.Fepois
      include_inherited: true
      members:
      - tidy
      - coef
      - se
      - tstat
      - pvalue
      - confint
      - resid
      - vcov
      - wald_test
      - summary
      - etable
      - coefplot
      - iplot
      - predict
      - fixef
      - ritest
      - plot_ritest
    - name: estimation.models.feglm_.Feglm
      include_inherited: true
      members:
      - tidy
      - coef
      - se
      - tstat
      - pvalue
      - confint
      - resid
      - vcov
      - wald_test
      - summary
      - etable
      - coefplot
      - iplot
      - predict
      - fixef
    - name: estimation.FixestMulti_.FixestMulti
      members:
      - to_list
      - fetch_model
      - tidy
      - confint
      - vcov
      - summary
      - etable
      - coefplot
      - iplot
      - wildboottest
    - name: estimation.quantreg.quantreg_.Quantreg
      include_inherited: true
      members:
      - tidy
      - coef
      - se
      - tstat
      - pvalue
      - confint
      - resid
      - vcov
      - wald_test
      - summary
      - etable
      - coefplot
      - iplot
      - predict
  - title: Fitted state
    desc: Detailed components exposed by supported fits. Most types are importable from
      `pyfixest.estimation.state`; each page states its import path, including the DiD,
      configuration, and small-sample correction types from other modules. Prefer accessing
      components through the fitted result. See [state availability](/reference-guide/model-storage.qmd#know-when-state-appears).
    contents:
    - estimation.state.EstimationOptions
    - estimation.state.GlmEstimationOptions
    - estimation.state.QuantregEstimationOptions
    - estimation.state.ModelDescription
    - estimation.state.ModelMatrix
    - estimation.state.ObservationWeights
    - estimation.state.EstimationSample
    - estimation.state.DroppedRowCounts
    - estimation.state.FixedEffectCounts
    - estimation.state.WithinLinearData
    - estimation.state.WithinIvData
    - estimation.state.CollinearityCheck
    - estimation.state.GlmWorkingState
    - estimation.state.FitStatistics
    - estimation.state.FittedValues
    - estimation.state.SandwichComponents
    - estimation.state.VarianceCovariance
    - estimation.state.WaldTest
    - estimation.state.FirstStage
    - estimation.state.FirstStageDiagnostics
    - estimation.state.QuantregSolution
    - estimation.state.VcovSpec
    - estimation.state.FixedEffectEstimates
    - estimation.state.FixedEffect
    - estimation.state.RitestStatistics
    - estimation.state.CoefficientTable
    - estimation.state.Capabilities
    - did.saturated_twfe.EventStudyDesign
    - estimation.internals.model_state.SampleSplit
    - estimation.internals.families.InferenceDist
    - estimation.internals.retention.RetentionPolicy
    - utils.utils.DegreesOfFreedomCounts
    - utils.utils.SmallSampleCorrection
  - title: Advanced formula and numerical APIs
    desc: Lower-level interfaces with explicit module import paths. Ordinary formulas go through
      the [formula tutorial](/tutorials/formula-syntax.qmd); estimator configuration goes through
      `demeaner=`.
    contents:
    - estimation.formula.parse.Formula
    - estimation.formula.model_matrix.create_model_matrix
    - estimation.formula.transforms.factor_interaction.factor_interaction
    - estimation.demean
    - name: demeaners.BaseDemeaner
      members: []
    - name: core.demean.Preconditioner
      dynamic: false
    - core.detect_singletons.detect_singletons
