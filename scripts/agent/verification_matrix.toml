# Commands are argument arrays and always enter through Pixi. Runtime labels are
# qualitative; the verification report records observed wall time.

[[check]]
id = "trailing-whitespace"
description = "Remove trailing whitespace from changed files"
tier = "edit"
runtime = "seconds"
domains = ["always"]
file_scope = "all"
command = ["pixi", "run", "-e", "lint", "prek", "run", "trailing-whitespace", "--files", "{files}"]
required_local = true
ci_allowed = false

[[check]]
id = "end-of-file"
description = "Normalize final newlines in changed files"
tier = "edit"
runtime = "seconds"
domains = ["always"]
file_scope = "all"
command = ["pixi", "run", "-e", "lint", "prek", "run", "end-of-file-fixer", "--files", "{files}"]
required_local = true
ci_allowed = false

[[check]]
id = "large-files"
description = "Reject unexpectedly large changed files"
tier = "edit"
runtime = "seconds"
domains = ["always"]
file_scope = "all"
command = ["pixi", "run", "-e", "lint", "prek", "run", "check-added-large-files", "--files", "{files}"]
required_local = true
ci_allowed = false

