[[check]]
id = "agent-tests"
description = "Run deterministic agent-workflow tests"
tier = "edit"
runtime = "seconds-to-minutes"
domains = ["agent"]
command = ["pixi", "run", "-e", "py312-r", "pytest", "tests/test_agent_workflow.py", "-x", "-q", "--no-cov"]
required_local = true
ci_allowed = false

[[check]]
id = "targeted-tests"
description = "Run changed test modules without long or external markers"
tier = "edit"
runtime = "seconds-to-minutes"
domains = ["tests"]
file_scope = "test-python"
command = ["pixi", "run", "-e", "py312-r", "pytest", "{files}", "-m", "not (extended or against_r_core or against_r_extended or plots or hac)", "-x", "-q", "--no-cov"]
required_local = true
ci_allowed = false

