name: CI

on:
  push:
    branches:
      - master
    tags:
      - '*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-version:
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Check tag matches Cargo.toml version
        run: python .github/check_version.py

  agent-docs:
    # Renders the documentation once per release and hands the bundled corpus
    # to every build job, so that all archives ship identical docs.
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.76.2
          cache: true
          cache-write: false
          frozen: true
          environments: docs
      - name: Render and bundle agent docs
        run: pixi run -e docs docs-bundle
      - name: Upload agent docs
        uses: actions/upload-artifact@v7
        with:
          name: agent-docs
          path: pyfixest/docs
          if-no-files-found: error

  linux:
    needs: [check-version, agent-docs]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.agent-docs.result == 'success' || needs.agent-docs.result == 'skipped') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
          - runner: ubuntu-22.04
            target: s390x
          - runner: ubuntu-22.04
            target: ppc64le
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Download agent docs
        if: ${{ needs.agent-docs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-docs
          path: pyfixest/docs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    needs: [check-version, agent-docs]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.agent-docs.result == 'success' || needs.agent-docs.result == 'skipped') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: x86
          - runner: ubuntu-22.04
            target: aarch64
          - runner: ubuntu-22.04
            target: armv7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Download agent docs
        if: ${{ needs.agent-docs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-docs
          path: pyfixest/docs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    needs: [check-version, agent-docs]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.agent-docs.result == 'success' || needs.agent-docs.result == 'skipped') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Download agent docs
        if: ${{ needs.agent-docs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-docs
          path: pyfixest/docs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    needs: [check-version, agent-docs]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.agent-docs.result == 'success' || needs.agent-docs.result == 'skipped') }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: x86_64
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Download agent docs
        if: ${{ needs.agent-docs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-docs
          path: pyfixest/docs
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    needs: [check-version, agent-docs]
    if: ${{ always() && (needs.check-version.result == 'success' || needs.check-version.result == 'skipped') && (needs.agent-docs.result == 'success' || needs.agent-docs.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Download agent docs
        if: ${{ needs.agent-docs.result == 'success' }}
        uses: actions/download-artifact@v8
        with:
          name: agent-docs
          path: pyfixest/docs
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [check-version, linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Check bundled docs in archives
        # PR #1473 adds skills/pyfixest/SKILL.md; extend REQUIRED with
        # "skills/pyfixest/SKILL.md" once that file is on master.
        run: |
          python - <<'PY'
          import glob
          import sys
          import tarfile
          import zipfile

          REQUIRED = ["pyfixest/docs/llms.txt"]

          archives = sorted(glob.glob("wheels-*/*.whl")) + sorted(glob.glob("wheels-sdist/*.tar.gz"))
          if not archives:
              sys.exit("no wheels or sdist found to check")

          for archive in archives:
              if archive.endswith(".whl"):
                  with zipfile.ZipFile(archive) as handle:
                      names = handle.namelist()
              else:
                  with tarfile.open(archive) as handle:
                      names = handle.getnames()
              for required in REQUIRED:
                  if not any(name.endswith(required) for name in names):
                      sys.exit(f"{archive} does not contain {required}")
              print(f"{archive}: ok")
          PY
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: PyO3/maturin-action@v1
        env:
          MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        with:
          command: upload
          args: --non-interactive --skip-existing wheels-*/*
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ""
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') || contains(github.ref, '0a') || contains(github.ref, '0b') }}
