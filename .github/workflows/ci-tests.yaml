name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test-minimal-install:
    name: "Test minimal installation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install base package
        run: |
          python -m venv /tmp/pyfixest-minimal
          /tmp/pyfixest-minimal/bin/python -m pip install .

      - name: Check core API without optional dependencies
        run: |
          /tmp/pyfixest-minimal/bin/python - <<'PY'
          from importlib.util import find_spec

          optional = [
              "great_tables",
              "lets_plot",
              "maketables",
              "matplotlib",
              "seaborn",
              "tabulate",
              "tqdm",
          ]
          installed = [package for package in optional if find_spec(package) is not None]
          assert not installed, f"Unexpected optional dependencies: {installed}"

          import pyfixest as pf

          fit = pf.feols("Y ~ X1", pf.get_data(N=100))
          fit.summary()

          try:
              fit.etable()
          except ImportError as exc:
              assert "pyfixest[tables]" in str(exc)
          else:
              raise AssertionError("etable() should require the tables extra")

          try:
              fit.coefplot(plot_backend="matplotlib")
          except ImportError as exc:
              assert "pyfixest[plots]" in str(exc)
          else:
              raise AssertionError("coefplot() should require the plots extra")
          PY

  test-python:
    name: "Tests Python (${{ matrix.environment }}, ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        environment: [py310, py314]
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.62.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          frozen: true
          environments: ${{ matrix.environment }}

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test-py
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 4

      - name: Upload coverage to Codecov (partial)
        if: matrix.environment == 'py314' && matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          partial: true
          flags: core-tests
          files: coverage.xml

  test-r:
    name: "Tests vs R (${{ matrix.test-task }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test-task: [test-r-core, test-r-extended, test-r-fixest, test-r-hac]
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.62.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          frozen: true
          environments: py312-r

      - name: Run ${{ matrix.test-task }}
        run: pixi run -e py312-r ${{ matrix.test-task }}
        env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 4

      - name: Upload coverage to Codecov (partial)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          partial: true
          flags: ${{ matrix.test-task }}
          files: coverage.xml

  merge_coverage:
    name: "Merge Coverage"
    runs-on: ubuntu-latest
    needs: [test-python, test-r]
    steps:
      - name: Final coverage merge
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          partial: false
          flags: final

  build-docs:
    name: "Build Docs"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.62.2
          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'master' }}
          frozen: true
          environments: docs

      - name: Build and render docs
        run: pixi run -e docs docs-render

      - name: Save docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_site

  publish-docs:
    name: "Publish Docs"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    needs: ["build-docs", "test-python"]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Download docs artifact
        uses: actions/download-artifact@v8
        with:
          name: docs-html
          path: docs/_site

      - name: Publish docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_site
