ci:
  autoupdate_schedule: monthly
  skip: [ty]

repos:
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=10000]
        exclude: pixi.lock
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: debug-statements
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
        types: [text]
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: no-commit-to-branch
        args: [--branch, main, --branch, master]
      - id: trailing-whitespace
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.37.4
    hooks:
      - id: check-github-workflows
        args: ["--verbose"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: ["--fix", "--output-format=full"]
        types_or: [jupyter, pyi, python]
      - id: ruff-format
        types_or: [jupyter, pyi, python]

  - repo: local
    hooks:
      - id: ty
        name: ty
        # The lint task installs the analysis environment before prek runs this
        # hook, so --python points ty at its third-party dependencies even in a
        # clean checkout. `--frozen` keeps the nested run from rewriting
        # pixi.lock.
        # Output format comes from [tool.ty.terminal] in pyproject.toml.
        entry: pixi run --frozen -e lint ty check --project . --python .pixi/envs/py312
        language: system
        pass_filenames: false
        always_run: true
