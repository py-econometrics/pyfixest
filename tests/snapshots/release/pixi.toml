[workspace]
name = "pyfixest-release-snapshots"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64", "osx-arm64"]

[dependencies]
python = "~=3.12.0"
pytest = ">=8"

[pypi-dependencies]
pyfixest = "==0.60.0"

[activation.env]
PYTHONHASHSEED = "0"
MPLCONFIGDIR = "$PIXI_PROJECT_ROOT/.pixi/matplotlib"
RAYON_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
VECLIB_MAXIMUM_THREADS = "1"
NUMEXPR_NUM_THREADS = "1"

[tasks]
record = { cmd = "python -P scripts/record_release_baseline.py", cwd = "../../..", description = "Record this platform's baseline for the pinned pyfixest release if it is missing or stale" }
provenance = { cmd = "python -P -c \"import pyfixest; print(pyfixest.__version__); print(pyfixest.__file__)\"", cwd = "../../..", description = "Print the isolated release interpreter provenance" }
